function qs(name) {
  return new URLSearchParams(location.search).get(name);
}

  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" });
}
function prettyDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function firstName(full) {
  return (full || "Guest").trim().split(/\s+/)[0];
}
function resolveSlug() {
  const fromUrl = (qs("unit") || "").trim().toLowerCase();
  if (fromUrl && UNITS[fromUrl]) return fromUrl;
  try {
    const saved = localStorage.getItem(STORE);
    if (saved && UNITS[saved]) return saved;
  } catch (e) {}
  return "";
}
function matchStay(inHouse, slug) {
  const unit = UNITS[slug];
  if (!unit || !Array.isArray(inHouse)) return null;
  const aliases = unit.aliases.map((a) => a.toLowerCase());
  return inHouse.find((row) => {
    const p = String(row.property || "").toLowerCase();
    return aliases.some((a) => p === a || p.includes(a) || a.includes(p));
  }) || null;

  if (code === 1) return "🌤️";
  if (code === 2) return "⛅";
  if (code === 3) return "☁️";
  if (code === 45 || code === 48) return "🌫️";
  if (code >= 51 && code <= 67) return "🌦️";
  if (code >= 71 && code <= 77) return "❄️";
  if (code >= 80 && code <= 82) return "🌧️";
  if (code >= 85 && code <= 86) return "🌨️";
  if (code >= 95) return "⛈️";
  return "🌡️";
}

let slug = resolveSlug();
let screenIndex = 0;
const SCREEN_COUNT = 4;
let idleTimer = null;
let stayCache = null;
let forecastCache = null;

function goTo(i) {
  screenIndex = Math.max(0, Math.min(i, SCREEN_COUNT - 1));
  document.getElementById("deck").style.transform = "translateX(-" + (screenIndex * (100 / SCREEN_COUNT)) + "%)";
  document.querySelectorAll(".dot").forEach((el, n) => el.classList.toggle("on", n === screenIndex));
  bumpIdle();
}
function bumpIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => goTo(0), 120000);
}

function renderPicker() {
  const box = document.getElementById("picker-list");
  box.innerHTML = Object.entries(UNITS).map(([id, u]) =>
    `<button class="pick" data-unit="${id}">${u.name}</button>`
  ).join("");
  box.querySelectorAll(".pick").forEach((btn) => {
    btn.addEventListener("click", () => {
      slug = btn.getAttribute("data-unit");
      try { localStorage.setItem(STORE, slug); } catch (e) {}
      document.getElementById("picker").classList.remove("on");
      bootUnit();
    });
  });
}

function buildForecast(stay) {
  if (!forecastCache || !forecastCache.daily) return "";
  const daily = forecastCache.daily;
  const todayISO = ctDate();
  let startIdx = daily.time.findIndex((t) => t >= todayISO);
  if (startIdx < 0) startIdx = 0;
  let endIdx = daily.time.length - 1;
  if (stay && stay.check_out) {
    const outIdx = daily.time.indexOf(stay.check_out);
    if (outIdx >= 0) endIdx = Math.max(outIdx, startIdx);
  }
  const span = daily.time.slice(startIdx, endIdx + 1).slice(0, 4);
  if (!span.length) return "";
  return span.map((iso, k) => {
    const i = startIdx + k;
    const label = k === 0 ? "Now" : new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
    return `<div class="day"><span>${label}</span><b>${wxIcon(daily.weather_code[i])} ${Math.round(daily.temperature_2m_max[i])}°</b></div>`;
  }).join("");
}

function renderWelcome(stay) {
  const unit = UNITS[slug];
  const vacant = !stay;
  const headline = vacant
    ? `Your Branson<br>vacation starts <em>now</em>.`
    : `${firstName(stay.guest)},<br>your Branson vacation<br>starts <em>now</em>.`;
  const lede = vacant
    ? `${unit.name} is between stays. The Ozarks are still out there.`
    : `Glad you're here. ${prettyDate(stay.check_in)} to ${prettyDate(stay.check_out)}.`;
  const days = buildForecast(stay) || `<div class="day"><span>Stay</span><b>Forecast…</b></div>`;
  document.getElementById("welcome").innerHTML = `
    <div class="cover">
      <div class="cover-top">
        <div class="brand">mybransonvacation.com</div>
        <div class="eyebrow">${unit.name} · Branson</div>
        <h1>${headline}</h1>
        <p class="lede">${lede}</p>
      </div>
      <div class="cover-bottom">
        <button class="jeb-btn" id="jeb-btn" type="button">
          <img src="/jeb/portrait.jpg" alt="">
          <span>Talk to Jeb<small>Need help? Tap here</small></span>
        </button>
        <div class="days">${days}</div>
      </div>
    </div>
  `;
  const jebBtn = document.getElementById("jeb-btn");
  if (jebBtn) {
    jebBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openOut(jebUrl());
    });
  }
}

function renderWifi() {
  const unit = UNITS[slug];
  document.getElementById("wifi").innerHTML = `
    <h2>Wi-Fi & quick start</h2>
    <div class="card">
      <div class="label">Network</div>
      <h3>${unit.network}</h3>

      <h3>${unit.password}</h3>
    </div>

    </div>

        <li>No illegal substances on the premises</li>
        <li>Tell us immediately if something breaks</li>

      </ul>
    </div>
    ${howtoBlock()}
    <div class="checkout">Check-out is 10:00 AM — all units</div>
  `;
}

async function loadForecast() {
  const url = "https://api.open-meteo.com/v1/forecast?latitude=36.6509&longitude=-93.3691&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=14";
  try {
    const data = await fetch(url, { cache: "no-store" }).then((r) => r.json());
    forecastCache = data;
  } catch (e) {
    forecastCache = null;
  }
}

async function loadWelcome() {
  let stay = null;
  try {
    const data = await fetch(GUEST_API, { cache: "no-store" }).then((r) => r.json());
    stay = matchStay(data.in_house || [], slug);
  } catch (e) {}
  stayCache = stay;
  renderWelcome(stay);
}

function jebUrl() {
  const u = new URL("https://www.mybransonvacation.com/jeb");
  if (slug) u.searchParams.set("unit", slug);
  u.searchParams.set("from", "kiosk");
  if (stayCache && stayCache.guest) u.searchParams.set("name", firstName(stayCache.guest));
  return u.toString();
}

function stayGuideUrl() {
  const unit = UNITS[slug];
  const u = new URL("https://www.mybransonvacation.com/guidebook/" + unit.guidebook);
  u.searchParams.set("from", "kiosk");
  if (slug) u.searchParams.set("unit", slug);
  if (stayCache) {
    if (stayCache.guest) u.searchParams.set("name", firstName(stayCache.guest));
    if (stayCache.check_in) u.searchParams.set("checkin", stayCache.check_in);
    if (stayCache.check_out) u.searchParams.set("checkout", stayCache.check_out);
  }
  return u.toString();
}

function youtubeIdFromUrl(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) return (u.pathname.replace(/^\//, "").split("/")[0] || "");
    return u.searchParams.get("v") || "";
  } catch (e) {
    return "";
  }
}

function playHowTo(id, title) {
  if (!id) return;
  document.getElementById("player-title").textContent = title || "How-to";
  document.getElementById("player-frame").src = "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0";
  document.getElementById("player").classList.add("on");
}

function closePlayer() {
  document.getElementById("player").classList.remove("on");
  document.getElementById("player-frame").src = "";
}

function howtoBlock() {
  const vids = HOWTO[slug] || [];
  if (!vids.length) return "";
  return `
    <div class="card">
      <div class="label">How-to videos</div>
      <p class="note">Walkthroughs for this home. Tap one to watch here. Then tap Back to tablet.</p>
      <div class="howto-list">
        ${vids.map((v) => `
          <button type="button" class="howto-card" data-yt="${v.id}" data-title="${v.title}">
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="">
            <div><b>${v.title}</b><span>Watch here</span></div>
          </button>
        `).join("")}
      </div>
    </div>`;
}

function openOut(url) {
  if (!url) return;
  const yt = youtubeIdFromUrl(url);
  if (yt) {
    playHowTo(yt, "Video");
    return;
  }
  try {
    if (typeof fully !== "undefined" && fully.loadUrl) {
      fully.loadUrl(url);
      return;
    }
  } catch (e) {}
  location.href = url;
}

function goHome() {
  try {
    if (typeof fully !== "undefined" && fully.loadStartUrl) {
      fully.loadStartUrl();
      return;
    }
  } catch (e) {}
  location.href = location.pathname + location.search;
}

function card(meta, title, sub, url) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "go-card";
  btn.innerHTML = `<div class="meta">${meta}</div><b>${title}</b><span>${sub || ""}</span>`;
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    openOut(url);
  });
  return btn;
}

async function loadGo() {
  const box = document.getElementById("go");
  box.innerHTML = "";
  box.appendChild(card("House", "Open the house guide", "Live guest app — Shows, Dining, Map, Adventure", stayGuideUrl()));
  try {
    const [att, shows, dining] = await Promise.all([
      fetch("https://www.mybransonvacation.com/api/attractions", { cache: "no-store" }).then((r) => r.json()),
      fetch("https://www.mybransonvacation.com/api/shows", { cache: "no-store" }).then((r) => r.json()),
      fetch("https://www.mybransonvacation.com/api/dining", { cache: "no-store" }).then((r) => r.json())
    ]);
    const featured = (att.attractions || []).find((a) => a.featured) || (att.attractions || [])[0];
    if (featured) box.appendChild(card(featured.tag || "Park", featured.name, featured.desc || "", featured.url));
    (shows.shows || []).slice(0, 4).forEach((s) => {
      box.appendChild(card(s.time || "Show", s.name, (s.venue || "") + (s.type ? " · " + s.type : ""), s.url));
    });
    (dining.restaurants || []).slice(0, 3).forEach((d) => {
      box.appendChild(card(d.tag || d.cuisine || "Eat", d.name, d.desc || d.venue || "", d.url));
    });
  } catch (e) {
    box.appendChild(card("Live", "Couldn’t load tonight’s board", "Home, then try again", stayGuideUrl()));
  }
}

function loadMap() {
  document.getElementById("map").src = MAP_URL;
}

function loadQR() {
  const payload = encodeURIComponent("Summers Vacations\nBrian 314-565-0589\nsummersvacationsllc@gmail.com\nEmergency 911");
  document.getElementById("qr").innerHTML =
    `<img alt="Contact QR" src="https://api.qrserver.com/v1/create-qr-code/?size=84x84&data=${payload}">`;
}

function buildDots() {
  const labels = ["Welcome", "Wi-Fi", "Go", "Map"];
  document.getElementById("dots").innerHTML = labels.map((name, i) =>
    `<button class="dot${i === 0 ? " on" : ""}" data-i="${i}" aria-label="${name}"></button>`
  ).join("");
  document.querySelectorAll(".dot").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      goTo(Number(btn.getAttribute("data-i")));
    });
  });
}

function bindNav() {
  document.getElementById("edge-l").addEventListener("click", () => goTo(screenIndex - 1));
  document.getElementById("edge-r").addEventListener("click", () => goTo(screenIndex + 1));
  let startX = 0;
  document.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    const dx = startX - e.changedTouches[0].clientX;
    if (Math.abs(dx) > 60) goTo(screenIndex + (dx > 0 ? 1 : -1));
  }, { passive: true });
}

async function bootUnit() {
  renderWifi();
  loadMap();
  await Promise.all([loadWelcome(), loadForecast(), loadGo()]);
  renderWelcome(stayCache);
  await loadGo();
}

function scheduleRefresh() {
  setInterval(() => {
    loadWelcome();
    loadForecast().then(() => renderWelcome(stayCache));
    loadGo();
  }, 15 * 60 * 1000);
}

function init() {
  buildDots();
  bindNav();
  loadQR();
  bumpIdle();
  renderPicker();
  document.getElementById("home-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    closePlayer();
    goHome();
  });
  document.getElementById("player-close").addEventListener("click", (e) => {
    e.stopPropagation();
    closePlayer();
  });
  document.getElementById("wifi").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-yt]");
    if (!btn) return;
    playHowTo(btn.getAttribute("data-yt"), btn.getAttribute("data-title") || "How-to");
  });
  document.getElementById("map-open").addEventListener("click", (e) => {
    e.stopPropagation();
    openOut(MAP_URL);
  });
  if (!slug) {
    document.getElementById("picker").classList.add("on");
    return;
  }
  bootUnit();
  scheduleRefresh();
}
init();
</script>
