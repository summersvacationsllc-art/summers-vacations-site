name: Branson Guest Daily Sync

on:
  schedule:
    # 5:30 AM CT = 10:30 UTC (standard time) / 10:30 UTC (CDT)
    # Cron runs in UTC. CDT is UTC-5, so 5:30 AM CT = 10:30 UTC
    - cron: '30 10 * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write  # needed to push to the repo
  actions: read

env:
  # These will be set as GitHub repository secrets
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  GUESTY_API_KEY: ${{ secrets.GUESTY_API_KEY }}
  GUESTY_ACCOUNT_ID: ${{ secrets.GUESTY_ACCOUNT_ID }}

jobs:
  guest-daily-sync:
    name: Guest Daily Sync (5:30 AM CT)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout summers-vacations-site
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout scout files
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: summersvacationsllc-art/branson-content-engine
          path: _food_scouts
          token: ${{ secrets.CONTENT_ENGINE_TOKEN || secrets.GITHUB_TOKEN }}
          # Single cone root — multi-path sparse-checkout has landed ONLY data/fishing
          # on ubuntu (2026-08-29 GHA), starving shows/food/golf/intel magazine sections.
          sparse-checkout: |
            data
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No cache - scripts use only stdlib (urllib, json, datetime, pathlib)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi

      - name: Run Guest Daily Sync
        id: sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GUESTY_API_KEY: ${{ secrets.GUESTY_API_KEY }}
          GUESTY_ACCOUNT_ID: ${{ secrets.GUESTY_ACCOUNT_ID }}
          # Scout root for build_today_reports (must match checkout path; never Mac absolute)
          BRANSON_ENGINE: ${{ github.workspace }}/_food_scouts
        run: |
          set -euo pipefail
          # America/Chicago calendar day — UTC date alone is wrong near midnight CT
          DATE=$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("America/Chicago")).strftime("%Y-%m-%d"))
          PY
          )
          echo "Running Guest Daily Sync for $DATE (CT date)"
          echo "BRANSON_ENGINE=$BRANSON_ENGINE"
          ls -la "$BRANSON_ENGINE/data" 2>/dev/null || echo "WARNING: scout data dir missing"

          echo "=== Hooked on Branson (USACE always-on; no Mac required) ==="
          FISH_SCOUT_DIR="_food_scouts/data/fishing" \
            python3 scripts/hooked_on_branson.py --date "$DATE" || echo "WARNING: hooked_on_branson failed"

          echo "=== Tonight in Branson (shows desk; no Mac required) ==="
          SHOW_SCOUT_DIR="_food_scouts/data/shows" \
          BRANSON_ENGINE="$BRANSON_ENGINE" \
            python3 scripts/tonight_in_branson.py --date "$DATE" || echo "WARNING: tonight_in_branson failed"

          # Snapshot prior magazine (if any) so empty-scout rebuild cannot clobber Hermes
          PRIOR="public/reports/$DATE.html"
          PRIOR_BAK="/tmp/prior-$DATE.html"
          if [ -f "$PRIOR" ]; then
            cp "$PRIOR" "$PRIOR_BAK"
            echo "Prior magazine bytes: $(wc -c < "$PRIOR_BAK")"
          fi
          
          # Step 1: Generate live snapshots from str-manager-one
          echo "=== Building guest-today.json ==="
          python3 scripts/build_guest_today.py --date "$DATE"
          
          echo "=== Building fleet-today.json ==="
          python3 scripts/build_fleet_today.py --date "$DATE"
          
          # Step 2: Generate the magazine HTML report from scout data
          echo "=== Building magazine report (YYYY-MM-DD.html) ==="
          python3 scripts/build_today_reports.py --date "$DATE"

          # Hard no-shrink: if builder still wrote under floor and prior was magazine, restore
          HTML_SIZE=$(wc -c < "public/reports/$DATE.html" 2>/dev/null || echo 0)
          if [ -f "$PRIOR_BAK" ]; then
            PRIOR_SIZE=$(wc -c < "$PRIOR_BAK")
            if [ "$HTML_SIZE" -lt 14000 ] && [ "$PRIOR_SIZE" -ge 14000 ]; then
              echo "RESTORE prior magazine (${PRIOR_SIZE}B) over thin build (${HTML_SIZE}B)"
              cp "$PRIOR_BAK" "public/reports/$DATE.html"
              HTML_SIZE=$PRIOR_SIZE
            fi
          fi

          echo "=== Sync map pins from scouts ==="
          if [ -d _food_scouts/data ]; then
            FOOD_SCOUT_DIR="_food_scouts/data/food" \
            GOLF_SCOUT_DIR="_food_scouts/data/golf" \
            FISH_SCOUT_DIR="_food_scouts/data/fishing" \
            INTEL_SCOUT_DIR="_food_scouts/data/intel" \
            STRIP_SCOUT_DIR="_food_scouts/data/strip" \
            LANDING_SCOUT_DIR="_food_scouts/data/landing" \
            python3 scripts/sync_map_places.py || echo "map sync skipped"
          else
            python3 scripts/sync_map_places.py || echo "map sync skipped"
          fi
          
          # Step 3: Verify outputs exist and have content
          echo "=== Verification ==="
          ls -la public/reports/
          
          # Check HTML has substance (not thin guard HTML)
          HTML_SIZE=$(wc -c < "public/reports/$DATE.html" 2>/dev/null || echo 0)
          if [ "$HTML_SIZE" -lt 14000 ]; then
            echo "WARNING: HTML size is $HTML_SIZE bytes (expected >= 14000 magazine floor)."
          else
            echo "HTML size: $HTML_SIZE bytes ✓"
          fi
          
          # Verify JSONs have today's date
          for f in fishing-data.json fishing-magazine.json shows-data.json shows-magazine.json manifest.json guest-today.json fleet-today.json; do
            if [ -f "public/reports/$f" ]; then
              DATE_IN_FILE=$(jq -r '.date // .latest // .updated // empty' "public/reports/$f" 2>/dev/null || echo "missing")
              echo "$f date: $DATE_IN_FILE"
            else
              echo "$f: MISSING"
            fi
          done

      - name: Commit and push reports
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Summers Vacations Bot"
          git config user.email "summersvacationsllc-art@users.noreply.github.com"
          
          # Only add the reports folder (safety)
          git add public/reports/
          
          # Check if there's anything to commit
          if git diff --cached --quiet; then
            echo "No changes to public/reports/ — skipping commit"
            exit 0
          fi
          
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "guest daily sync: $DATE Branson report data"
          git push origin HEAD:main
          echo "Pushed updated reports to main"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Guest Daily Sync failed — check workflow logs"
          # Could add Slack/email/webhook notification here later